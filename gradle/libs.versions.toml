[versions]
agp = "8.13.2"
kotlin = "2.4.10"
coreKtx = "1.18.0"  # 1.19.0 requires AGP 9.1+
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# All androidx.lifecycle artifacts ship in lockstep; keep them on one ref.
# 2.11.0 requires AGP 9.1+, so it waits for the AGP upgrade.
lifecycle = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
legacySupportV4 = "1.0.0"
fragmentKtx = "1.8.9"
koin = "4.2.2"
kotpref = "2.13.2"
gson = "2.14.0"
gsonSupport = "2.13.2"
livedataSupport = "2.13.2"
usbSerialForAndroid = "3.11.0"
volley = "1.2.1"
coilCompose = "3.5.0"
runtimeLivedata = "1.11.4"
accompanistSystemuicontroller = "0.36.0"
exifinterface = "1.4.2"
kpermissions = "3.5.0"
kpermissionsRx = "3.5.0"
colorpickerCompose = "1.2.0"
material3 = "1.4.0"
colorpicker = "1.0.0"
appUpdate = "2.1.0"
firebaseBom = "34.16.0"
googleServices = "4.5.0"
crashlyticsPlugin = "3.0.7"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-legacy-support-v4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "legacySupportV4" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
kotpref = { group = "com.chibatching.kotpref", name = "kotpref", version.ref = "kotpref" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
gson-support = { group = "com.chibatching.kotpref", name = "gson-support", version.ref = "gsonSupport" }
androidx-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
livedata-support = { group = "com.chibatching.kotpref", name = "livedata-support", version.ref = "livedataSupport" }
usb-serial-for1-android = { module = "com.github.mik3y:usb-serial-for-android", version.ref = "usbSerialForAndroid" }
volley = { group = "com.android.volley", name = "volley", version.ref = "volley" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coilCompose" }
# Coil 3 ships no network fetcher in coil-compose; without this, https:// models fail.
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coilCompose" }
androidx-compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata", version.ref = "runtimeLivedata" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
accompanist-systemuicontroller = { group = "com.google.accompanist", name = "accompanist-systemuicontroller", version.ref = "accompanistSystemuicontroller" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
kpermissions = { group = "com.github.fondesa", name = "kpermissions", version.ref = "kpermissions" }
kpermissions-rx3 = { group = "com.github.fondesa", name = "kpermissions-rx3", version.ref = "kpermissions" }
colorpicker-compose = { group = "com.github.skydoves", name = "colorpicker-compose", version.ref = "colorpickerCompose" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
colorpicker = { group = "io.mhssn", name = "colorpicker", version.ref = "colorpicker" }
play-app-update = { group = "com.google.android.play", name = "app-update", version.ref = "appUpdate" }
play-app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "appUpdate" }
# Versions come from the Firebase BOM below — do not pin them here.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }

